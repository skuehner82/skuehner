<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EuroStatdle - Das Länder-Ratespiel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            850: '#1f2937',
                            900: '#111827',
                            950: '#030712',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .guess-row {
            animation: fadeIn 0.4s ease-out forwards;
        }
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4B5563; }

        /* Map Styles */
        .map-country {
            fill: #374151;
            stroke: #1f2937;
            stroke-width: 0.5;
            transition: fill 0.3s ease;
            cursor: pointer;
        }
        .map-country:hover {
            fill: #4b5563;
        }
        .map-country.guessed-wrong {
            fill: #ef4444 !important;
        }
        .map-country.guessed-correct {
            fill: #10b981 !important;
        }
        .microstate {
            stroke: #ffffff;
            stroke-width: 1;
            transition: fill 0.3s ease;
            cursor: pointer;
        }
        
        #map-tooltip {
            position: absolute;
            opacity: 0;
            background: #111827;
            color: #f3f4f6;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 14px;
            pointer-events: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #374151;
            transition: opacity 0.2s;
            z-index: 50;
        }

        .toggle-checkbox:checked {
            right: 0;
            border-color: #3b82f6;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #3b82f6;
        }
    </style>
</head>

        const MAX_GUESSES = 6;

        // DOM Elements

        let mapSvg, projection, pathGenerator;
        
        function initMap() {
            const containerWidth = mapContainer.clientWidth || 400;
            const containerHeight = mapContainer.clientHeight || 500;

            d3.select("#map-container svg").remove();

            mapSvg = d3.select("#map-container")
                .append("svg")
                .attr("width", "100%")
                .attr("height", "100%")
                .attr("viewBox", `0 0 ${containerWidth} ${containerHeight}`)
                .style("background", "transparent");

            projection = d3.geoMercator()
                .center([15, 52])
                .scale(containerWidth * 1.1) 
                .translate([containerWidth / 2, containerHeight / 2]);

            pathGenerator = d3.geoPath().projection(projection);
            const tooltip = d3.select("#map-tooltip");

            d3.json('https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson').then(data => {
                mapSvg.append("g")
                    .selectAll("path")
                    .data(data.features)
                    .enter()
                    .append("path")
                    .attr("d", pathGenerator)
                    .attr("id", d => "path-" + d.id)
                    .attr("class", d => {
                        const isInGame = countriesData.find(c => c.id === d.id);
                        return isInGame ? "map-country" : "hidden";
                    })
                    .on("mouseover", function(event, d) {
                        if(isHardMode) return;
                        const c = countriesData.find(c => c.id === d.id);
                        if(c) {
                            tooltip.transition().duration(200).style("opacity", 1);
                            tooltip.html(c.name)
                                .style("left", (event.pageX + 10) + "px")
                                .style("top", (event.pageY - 28) + "px");
                        }
                    })
                    .on("mouseout", function() {
                        tooltip.transition().duration(500).style("opacity", 0);
                    })
                    .on("click", function(event, d) {
                        if(isHardMode || gameIsOver) return;
                        const c = countriesData.find(c => c.id === d.id);
                        if(c) {
                            inputEl.value = c.name;
                            handleGuess();
                        }
                    });

                const microstates = countriesData.filter(c => c.isMicro);
                mapSvg.append("g")
                    .selectAll("circle")
                    .data(microstates)
                    .enter()
                    .append("circle")
                    .attr("id", d => "path-" + d.id)
                    .attr("class", "map-country microstate")
                    .attr("cx", d => projection([d.lng, d.lat])[0])
                    .attr("cy", d => projection([d.lng, d.lat])[1])
                    .attr("r", 5)
                    .attr("fill", "#374151")
                    .on("mouseover", function(event, d) {
                        if(isHardMode) return;
                        tooltip.transition().duration(200).style("opacity", 1);
                        tooltip.html(d.name)
                            .style("left", (event.pageX + 10) + "px")
                            .style("top", (event.pageY - 28) + "px");
                    })
                    .on("mouseout", function() {
                        tooltip.transition().duration(500).style("opacity", 0);

        // Hilfsfunktion: Bestimmt das Tagesland anhand des UTC-Datums
        function getDailyTargetCountry() {
            const now = new Date();
            // Erzeuge einen String im Format YYYY-MM-DD basierend auf UTC (englische Zeit / 00:00 UTC)
            const utcYear = now.getUTCFullYear();
            const utcMonth = String(now.getUTCMonth() + 1).padStart(2, '0');
            const utcDate = String(now.getUTCDate()).padStart(2, '0');
            const dateString = `${utcYear}-${utcMonth}-${utcDate}`;

            // Einfacher Hash-Algorithmus aus dem Datums-String
            let hash = 0;
            for (let i = 0; i < dateString.length; i++) {
                hash = ((hash << 5) - hash) + dateString.charCodeAt(i);
                hash |= 0;
            }
            const index = Math.abs(hash) % countriesData.length;
            return { country: countriesData[index], dateString };
        }

        // Startet den Countdown bis Mitternacht UTC
        function startCountdown() {
            if (countdownInterval) clearInterval(countdownInterval);
            
            function updateTimer() {
                const now = new Date();
                const utcNow = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), now.getUTCHours(), now.getUTCMinutes(), now.getUTCSeconds());
                
                // Nächster Tag 00:00:00 UTC
                const nextMidnightUTC = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1, 0, 0, 0);
                const diff = nextMidnightUTC - utcNow;

                if (diff <= 0) {
                    countdownTimer.textContent = "00:00:00";
                    clearInterval(countdownInterval);
                    // Automatischer Reset bei Tageswechsel
                    initGame();
                    return;
                }

                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((diff / (1000 * 60)) % 60);
                const seconds = Math.floor((diff / 1000) % 60);

                countdownTimer.textContent = 
                    String(hours).padStart(2, '0') + ":" + 
                    String(minutes).padStart(2, '0') + ":" + 
                    String(seconds).padStart(2, '0');
            }

            updateTimer();
            countdownInterval = setInterval(updateTimer, 1000);
        }

        function initGame() {
            gameIsOver = false;
            d3.selectAll(".map-country").classed("guessed-wrong", false).classed("guessed-correct", false);

            if (currentMode === 'daily') {
                const daily = getDailyTargetCountry();
                targetCountry = daily.country;
                
                // Lade gespeicherten Fortschritt für heute aus dem LocalStorage
                const savedData = JSON.parse(localStorage.getItem('eurostatdle_daily_' + daily.dateString));
                
                if (savedData) {
                    guesses = savedData.guesses.map(name => countriesData.find(c => c.name === name)).filter(Boolean);
                    gameIsOver = savedData.gameIsOver;
                } else {
                    guesses = [];
                    gameIsOver = false;
                }
            } else {
                targetCountry = countriesData[Math.floor(Math.random() * countriesData.length)];
                guesses = [];
            }
            
            inputEl.value = '';
            errorMsg.classList.add('hidden');
            datalist.innerHTML = '';
            
            countriesData.forEach(country => {
                const option = document.createElement('option');
                option.value = country.name;
                datalist.appendChild(option);
            });

            updateAttemptsDisplay();
            renderGuesses();
            updateMapColors();

            if (gameIsOver) {
                showEndScreen();
            } else {
                gameActiveUi.classList.remove('hidden');
                endUi.classList.add('hidden');
                inputEl.disabled = false;
            }
        }

        function updateMapColors() {
            if (!mapSvg) return;
            guesses.forEach(g => {
                if (g.id !== targetCountry.id || !gameIsOver) {
                    d3.select("#path-" + g.id).classed("guessed-wrong", true);
                }
            });
            if (gameIsOver) {
                d3.select("#path-" + targetCountry.id).classed("guessed-correct", true);
            }
        }

        function saveDailyProgress() {
            if (currentMode === 'daily') {
                const daily = getDailyTargetCountry();
                const dataToSave = {
                    guesses: guesses.map(g => g.name),
                    gameIsOver: gameIsOver
                };
                localStorage.setItem('eurostatdle_daily_' + daily.dateString, JSON.stringify(dataToSave));
            }
        }

        function getDirection(lat1, lon1, lat2, lon2) {
            let dLon = (lon2 - lon1) * Math.PI / 180;
            lat1 = lat1 * Math.PI / 180;
            lat2 = lat2 * Math.PI / 180;
            
            let y = Math.sin(dLon) * Math.cos(lat2);
            let x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
            let brng = Math.atan2(y, x) * 180 / Math.PI;
            brng = (brng + 360) % 360;
            
            const compass = ["N", "NO", "O", "SO", "S", "SW", "W", "NW"];
            const index = Math.round(brng / 45) % 8;
            if (lat1 === lat2 && lon1 === lon2) return "✓";
            return compass[index];
        }

        function getDirectionArrow(direction) {
            const arrows = {
                "N": "⬆️", "NO": "↗️", "O": "➡️", "SO": "↘️",
                "S": "⬇️", "SW": "↙️", "W": "⬅️", "NW": "↖️", "✓": "🎯"
            };
            return arrows[direction] || "";
        }

        function formatNumber(num) {
            return new Intl.NumberFormat('de-DE').format(num);
        }

        function getFeedback(guessValue, targetValue) {
            if (guessValue === targetValue) {
                return { icon: '✓', color: 'text-emerald-400', bg: 'bg-emerald-400/10 border-emerald-400/20' };
            } else if (targetValue > guessValue) {
                return { icon: '↑', color: 'text-blue-400', bg: 'bg-blue-400/10 border-blue-400/20' }; 
            } else {
                return { icon: '↓', color: 'text-orange-400', bg: 'bg-orange-400/10 border-orange-400/20' }; 
            }
        }

        function handleGuess() {
            if (gameIsOver) return;

            const inputValue = inputEl.value.trim();
            if (!inputValue) return;

            const guessedCountry = countriesData.find(c => c.name.toLowerCase() === inputValue.toLowerCase());

            if (!guessedCountry) {
                showError("Land nicht gefunden oder außerhalb Europas.");
                return;
            }

            if (guesses.some(g => g.name === guessedCountry.name)) {
                showError("Land wurde schon geraten.");
                inputEl.value = '';
                return; 
            }

            errorMsg.classList.add('hidden');
            guesses.unshift(guessedCountry);
            inputEl.value = '';
            
            updateAttemptsDisplay();
            renderGuesses();
            
            if (guessedCountry.id !== targetCountry.id) {
                d3.select("#path-" + guessedCountry.id).classed("guessed-wrong", true);
            }

            checkGameEnd(guessedCountry);
            saveDailyProgress();
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.remove('hidden');
            inputEl.classList.add('shake');
            setTimeout(() => inputEl.classList.remove('shake'), 500);
        }

        function updateAttemptsDisplay() {
            attemptsDisplay.textContent = `${guesses.length} / ${MAX_GUESSES}`;
        }

        function renderGuesses() {
            if (guesses.length === 0) {
                guessesContainer.innerHTML = '';
                guessesContainer.appendChild(emptyState);
                return;
            }

            guessesContainer.innerHTML = '';

            guesses.forEach(guess => {
                const popFeedback = getFeedback(guess.pop, targetCountry.pop);
                const areaFeedback = getFeedback(guess.area, targetCountry.area);
                const tempFeedback = getFeedback(guess.temp, targetCountry.temp);
                
                const compassDir = getDirection(guess.lat, guess.lng, targetCountry.lat, targetCountry.lng);
                const arrowDir = getDirectionArrow(compassDir);

                const isCorrect = guess.name === targetCountry.name;
                const nameStyle = isCorrect ? 'text-emerald-400 font-bold' : 'text-gray-200';
                const dirBg = isCorrect ? 'bg-emerald-400/10 border-emerald-400/20 text-emerald-400' : 'bg-gray-800 border-gray-700 text-gray-300';

                const tr = document.createElement('tr');
                tr.className = 'guess-row hover:bg-gray-800/30 transition-colors';
                
                tr.innerHTML = `
                    <td class="p-3 sm:p-4 whitespace-nowrap ${nameStyle}">${guess.name}</td>
                    <td class="p-3 sm:p-4 text-center">
                        <div class="inline-flex items-center justify-center gap-1 border px-2 py-1 sm:px-3 sm:py-1.5 rounded-lg ${dirBg} font-mono w-16">
                            <span>${arrowDir}</span> <span class="text-xs ml-1">${compassDir !== '✓' ? compassDir : ''}</span>
                        </div>
                    </td>
                    <td class="p-3 sm:p-4 text-right">
                        <div class="inline-flex items-center justify-end gap-2 border px-2 py-1 sm:px-3 sm:py-1.5 rounded-lg ${popFeedback.bg}">
                            <span class="text-gray-300 font-mono text-xs sm:text-sm">${formatNumber(guess.pop)}</span>
                            <span class="font-bold text-sm sm:text-lg w-4 sm:w-5 text-center ${popFeedback.color}">${popFeedback.icon}</span>
                        </div>
                    </td>
                    <td class="p-3 sm:p-4 text-right">
                        <div class="inline-flex items-center justify-end gap-2 border px-2 py-1 sm:px-3 sm:py-1.5 rounded-lg ${areaFeedback.bg}">
                            <span class="text-gray-300 font-mono text-xs sm:text-sm">${formatNumber(guess.area)}</span>
                            <span class="font-bold text-sm sm:text-lg w-4 sm:w-5 text-center ${areaFeedback.color}">${areaFeedback.icon}</span>
                        </div>
                    </td>
                    <td class="p-3 sm:p-4 text-right">
                        <div class="inline-flex items-center justify-end gap-2 border px-2 py-1 sm:px-3 sm:py-1.5 rounded-lg ${tempFeedback.bg}">
                            <span class="text-gray-300 font-mono text-xs sm:text-sm">${guess.temp}°C</span>
                            <span class="font-bold text-sm sm:text-lg w-4 sm:w-5 text-center ${tempFeedback.color}">${tempFeedback.icon}</span>
                        </div>
                    </td>
                `;
                guessesContainer.appendChild(tr);
            });
        }

        function checkGameEnd(guessedCountry) {
            const isWin = guessedCountry.name === targetCountry.name;
            const isLoss = guesses.length >= MAX_GUESSES && !isWin;

            if (isWin || isLoss) {
                gameIsOver = true;
                inputEl.disabled = true;
                d3.select("#path-" + targetCountry.id).classed("guessed-correct", true);
                
                setTimeout(() => {
                    showEndScreen();
                }, 500);
            } else {
                inputEl.focus();
            }
        }

        function showEndScreen() {
            gameActiveUi.classList.add('hidden');
            endUi.classList.remove('hidden');

            const isWin = guesses.some(g => g.name === targetCountry.name);

            if(isWin) {
                iconWin.classList.remove('hidden');
                iconLoss.classList.add('hidden');
                endTitle.textContent = "Richtig geraten!";
                endTitle.className = "text-2xl font-bold text-emerald-400 mb-2";
                endDesc.textContent = `Du hast ${targetCountry.name} in ${guesses.length} Versuchen gefunden.`;
            } else {
                iconWin.classList.add('hidden');
                iconLoss.classList.remove('hidden');
                endTitle.textContent = "Game Over!";
                endTitle.className = "text-2xl font-bold text-red-400 mb-2";
                endDesc.innerHTML = `Das gesuchte Land war <strong>${targetCountry.name}</strong>.`;
            }

            if (currentMode === 'daily') {
                dailyCountdownBox.classList.remove('hidden');
                nextRoundBtn.classList.add('hidden');
                startCountdown();
            } else {
                dailyCountdownBox.classList.add('hidden');
                nextRoundBtn.classList.remove('hidden');
            }
        }

        // Tab Switching
        tabDaily.addEventListener('click', () => {
            currentMode = 'daily';
            tabDaily.className = "px-5 py-2 rounded-xl font-semibold text-sm transition-all bg-blue-600 text-white shadow-lg shadow-blue-500/20";
            tabInfinite.className = "px-5 py-2 rounded-xl font-semibold text-sm transition-all bg-gray-800 text-gray-400 hover:text-white";
            gameModeIndicator.textContent = "Tagesrätsel";
            initGame();
        });

        tabInfinite.addEventListener('click', () => {
            currentMode = 'infinite';
            tabInfinite.className = "px-5 py-2 rounded-xl font-semibold text-sm transition-all bg-blue-600 text-white shadow-lg shadow-blue-500/20";
            tabDaily.className = "px-5 py-2 rounded-xl font-semibold text-sm transition-all bg-gray-800 text-gray-400 hover:text-white";
            gameModeIndicator.textContent = "Unendlich-Modus";
            initGame();
        });

        guessBtn.addEventListener('click', handleGuess);
        inputEl.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleGuess(); });
        inputEl.addEventListener('input', () => errorMsg.classList.add('hidden'));

        nextRoundBtn.addEventListener('click', () => {
            initGame();
            inputEl.focus();
        });

        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            initGame();
        });
    </script>
</body>
</html>
